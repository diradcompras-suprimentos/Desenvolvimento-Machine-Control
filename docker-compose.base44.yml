services:
  api:
    image: node:22
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - db-data:/app/backend/data
    command: ["sh", "-ec", "mkdir -p data && npm install && exec npx nodemon --ignore data/ server.js"]
    environment:
      - PORT=8000
      - NODE_ENV=development
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/equipamentos').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: on-failure

  web:
    image: node:22-slim
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "3000:5173"
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: on-failure

volumes:
  db-data:
