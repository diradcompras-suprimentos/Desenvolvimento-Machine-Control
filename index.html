<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventário de Equipamentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Inventário de Equipamentos</span>
    </div>
  </nav>

  <div class="container my-4">
    <!-- Título e ações -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <h3 class="fw-bold">Equipamentos Cadastrados</h3>
      <input type="text" id="busca" class="form-control" placeholder="Buscar equipamento..." onkeyup="filtrarEquipamentos()" style="max-width:250px;">
      <div class="d-flex gap-2">
        <button class="btn btn-success" onclick="exportarExcel()">📊 Exportar Excel</button>
        <button class="btn btn-danger" onclick="exportarPDF()">📕 Exportar PDF</button>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#formModal">➕ Adicionar</button>
      </div>
    </div>

    <!-- Grid de Cards -->
    <div class="row" id="equipamentosGrid"></div>
  </div>

  <!-- Modal Formulário -->
  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Adicionar / Editar Equipamento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="equipamentoForm">
            <input type="hidden" id="editIndex">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nome</label>
                <input type="text" id="nome" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Marca</label>
                <input type="text" id="marca" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Modelo</label>
                <input type="text" id="modelo" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Nº de Série</label>
                <input type="text" id="serie" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Local</label>
                <input type="text" id="local" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Status</label>
                <select id="status" class="form-select">
                  <option value="Ativo">Ativo</option>
                  <option value="Inativo">Inativo</option>
                  <option value="Manutenção">Manutenção</option>
                </select>
              </div>
              <div class="col-md-12">
                <label class="form-label">Anexar Imagem</label>
                <input type="file" id="imagem" class="form-control" accept="image/*">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="salvarEquipamento(event)">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Detalhes -->
  <div class="modal fade" id="detalhesModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Detalhes do Equipamento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="detalhesConteudo"></div>
          <hr>
          <h5 class="fw-bold mb-3">Histórico de Manutenção</h5>
          <div id="historicoLista"></div>
          <hr>
          <h6 class="fw-bold">Adicionar Registro de Manutenção</h6>
          <form id="historicoForm">
            <div class="row g-3 mt-1">
              <div class="col-md-6">
                <label class="form-label">Peças Trocadas</label>
                <input type="text" id="histPecas" class="form-control" placeholder="Ex: Filtro de óleo, Correia...">
              </div>
              <div class="col-md-6">
                <label class="form-label">Data da Troca</label>
                <input type="date" id="histData" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Empresa Responsável</label>
                <input type="text" id="histEmpresa" class="form-control" placeholder="Nome da empresa">
              </div>
              <div class="col-md-12">
                <label class="form-label">Observação</label>
                <textarea id="histObs" class="form-control" rows="2" placeholder="Observações sobre o reparo..."></textarea>
              </div>
              <div class="col-12">
                <button type="button" class="btn btn-success" onclick="salvarHistorico(event)">+ Adicionar Registro</button>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts principais -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>

  <!-- SheetJS para Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- jsPDF + autoTable para PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
</body>
</html>
